<svg xmlns="http://www.w3.org/2000/svg" width="1128" height="191" viewBox="0 0 1128 191">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1128" y2="191" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050608"/>
      <stop offset="100%" stop-color="#08090F"/>
    </linearGradient>

    <!-- Violet glow left -->
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(180 95) scale(320 280)">
      <stop offset="0%" stop-color="#6D5BFF" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#6D5BFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Violet glow right -->
    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(950 95) scale(260 220)">
      <stop offset="0%" stop-color="#6D5BFF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#6D5BFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip to banner bounds -->
    <clipPath id="bannerClip">
      <rect width="1128" height="191"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">

    <!-- Base background -->
    <rect width="1128" height="191" fill="url(#bg)"/>

    <!-- Ambient glow overlays -->
    <rect width="1128" height="191" fill="url(#glowLeft)"/>
    <rect width="1128" height="191" fill="url(#glowRight)"/>

    <!-- Subtle dot grid -->
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#ffffff" fill-opacity="0.025"/>
    </pattern>
    <rect width="1128" height="191" fill="url(#dots)"/>

    <!-- Top border accent line -->
    <rect x="0" y="0" width="1128" height="1" fill="#6D5BFF" fill-opacity="0.25"/>

    <!-- AI Core rings (right side, partially cropped) -->
    <!-- Outer ring -->
    <circle cx="1020" cy="95" r="130" fill="none" stroke="#6D5BFF" stroke-opacity="0.07" stroke-width="1"/>
    <!-- Middle ring -->
    <circle cx="1020" cy="95" r="95" fill="none" stroke="#6D5BFF" stroke-opacity="0.10" stroke-width="1"/>
    <!-- Inner ring -->
    <circle cx="1020" cy="95" r="62" fill="none" stroke="#6D5BFF" stroke-opacity="0.13" stroke-width="1"/>
    <!-- Core -->
    <circle cx="1020" cy="95" r="32" fill="#6D5BFF" fill-opacity="0.06"/>
    <circle cx="1020" cy="95" r="18" fill="#6D5BFF" fill-opacity="0.09"/>
    <circle cx="1020" cy="95" r="7" fill="#6D5BFF" fill-opacity="0.5"/>
    <!-- Core glow -->
    <circle cx="1020" cy="95" r="7" fill="#8B7AFF" fill-opacity="0.9"/>

    <!-- Orbit dots on rings -->
    <circle cx="1020" cy="-35" r="2.5" fill="#6D5BFF" fill-opacity="0.5"/>
    <circle cx="1115" cy="95" r="2" fill="#6D5BFF" fill-opacity="0.4"/>
    <circle cx="964" cy="38" r="1.8" fill="#6D5BFF" fill-opacity="0.45"/>
    <circle cx="1076" cy="152" r="1.5" fill="#6D5BFF" fill-opacity="0.35"/>

    <!-- Small secondary core (far left, subtle) -->
    <circle cx="60" cy="150" r="40" fill="none" stroke="#6D5BFF" stroke-opacity="0.05" stroke-width="1"/>
    <circle cx="60" cy="150" r="22" fill="none" stroke="#6D5BFF" stroke-opacity="0.07" stroke-width="1"/>
    <circle cx="60" cy="150" r="5" fill="#6D5BFF" fill-opacity="0.25"/>

    <!-- ── WORDMARK ── -->
    <!-- "G" letter -->
    <text x="140" y="122"
      font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
      font-size="52"
      font-weight="700"
      letter-spacing="-2"
      fill="#FFFFFF"
      fill-opacity="0.95">Gunimi</text>

    <!-- AI Core dot after wordmark -->
    <circle cx="416" cy="103" r="4" fill="#8B7AFF" fill-opacity="0.9"/>
    <circle cx="416" cy="103" r="8" fill="#6D5BFF" fill-opacity="0.15"/>

    <!-- Tagline -->
    <text x="140" y="148"
      font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
      font-size="15"
      font-weight="400"
      letter-spacing="0.5"
      fill="#9AA3B2"
      fill-opacity="0.70">AI Workspace Operating System</text>

    <!-- Separator line between tagline and badge -->
    <rect x="140" y="158" width="32" height="1" fill="#6D5BFF" fill-opacity="0.4"/>

    <!-- Small label -->
    <text x="140" y="176"
      font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
      font-size="10"
      font-weight="500"
      letter-spacing="2"
      fill="#6D5BFF"
      fill-opacity="0.55">INTELLIGENCE · RELATIONSHIPS · WORKSPACE</text>

    <!-- Top-left subtle label -->
    <text x="140" y="52"
      font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
      font-size="10"
      font-weight="500"
      letter-spacing="2.5"
      fill="#ffffff"
      fill-opacity="0.12">gunimi.com</text>

  </g>
</svg>
